<div class="movie-rows-container">
    <div class="movie-row">
        <h2 class="row-title">Trending Now</h2>
        <app-movie-list [mode]="'TREND'" />
    </div>

    @if (genres) {
        @for (genre of genres; track genre.id) {
            <div class="movie-row">
                <h2 class="row-title">{{genre.name}}</h2>
                <app-movie-list mode="GENRE" [genreId]="genre.id" />
            </div>
        }
    }
</div>
